name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build APK
        run: gradle assembleDebug --no-daemon -PdataUrl=https://github.com/${{ github.repository }}/releases/download/data/gt-assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GameTurbo-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Zip paket data
        run: cd packs && zip -r ../gt-assets.zip .
      - name: Publish paket data (diunduh app saat pertama dibuka)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data
          name: Data Game Turbo
          prerelease: true
          files: gt-assets.zip
      - name: Publish APK (link download untuk semua orang)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Game Turbo (APK terbaru)
          files: app/build/outputs/apk/debug/app-debug.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GameTurbo-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Buka app di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash scripts/smoke.sh
      - name: Ringkasan hasil
        if: always()
        run: |
          if [ ! -f logcat.txt ]; then
            echo "### Emulator gagal jalan, tidak ada log" >> $GITHUB_STEP_SUMMARY
          elif grep -q "FATAL EXCEPTION" logcat.txt; then
            echo "### APP CRASH saat dibuka" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 40 "FATAL EXCEPTION" logcat.txt | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### Aplikasi terbuka tanpa crash di emulator" >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            logcat.txt
            screen.png
